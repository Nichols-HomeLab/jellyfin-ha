name: HA Build & Push to Gitea

on:
  push:
    branches:
      - master
      - main
      - "feat/ha-*"
      - "feat/phase*"
      - "copilot/*"
  # pull_request intentionally removed: this workflow runs on self-hosted k3s
  # runners. Allowing pull_request events from a public repo would let any
  # internet user execute arbitrary code inside the cluster network.
  # CI build feedback on PRs is provided by ci-tests.yml (GitHub-hosted runners).

# Cancel in-progress runs when a new push arrives on the same branch.
concurrency:
  group: ha-build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-push:
    runs-on: [self-hosted, k3s, linux, amd64]

    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Login to Gitea container registry
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4
        with:
          registry: git.nicholstech.org
          # act_runner 0.6.1 renders github.actor as "%!t(string=admin)"
          # when it is passed directly to an action input. Gitea's per-run
          # token is issued for the repository owner, so use that stable
          # identity until the runner expression bug is upgraded away.
          username: admin
          # Gitea's per-run token is repository-scoped but does not carry the
          # package scope required by the container registry.
          password: ${{ secrets.REGISTRY_TOKEN }}

      - name: Set image metadata
        id: meta
        run: |
          REPO="git.nicholstech.org/nichols-homelab/jellyfin-ha-pgsql"
          SHORT_SHA="${GITHUB_SHA::7}"
          echo "image_repo=${REPO}" >> "$GITHUB_OUTPUT"
          echo "short_sha=${SHORT_SHA}"  >> "$GITHUB_OUTPUT"

      - name: Connect to the nested Docker daemon
        run: |
          # act_runner creates this job inside the runner's sibling DinD
          # daemon. The daemon is listening on the job bridge gateway, not on
          # this container's /var/run/docker.sock.
          # The minimal runner image does not include iproute2. Linux exposes
          # the default gateway in little-endian hex through /proc/net/route.
          gateway_hex="$(awk '$2 == "00000000" { print $3; exit }' /proc/net/route)"
          test "${#gateway_hex}" -eq 8
          printf -v docker_gateway '%d.%d.%d.%d' \
            "0x${gateway_hex:6:2}" "0x${gateway_hex:4:2}" \
            "0x${gateway_hex:2:2}" "0x${gateway_hex:0:2}"
          test -n "${docker_gateway}"
          docker_host="tcp://${docker_gateway}:2375"
          DOCKER_HOST="${docker_host}" docker version >/dev/null
          echo "DOCKER_HOST=${docker_host}" >> "$GITHUB_ENV"

      - name: Install pinned .NET SDK
        # The runner image intentionally stays small. Copy the version pinned
        # by global.json from Microsoft's SDK image instead of the dot.net
        # installer redirect, which is unavailable during DNS incidents.
        run: |
          DOTNET_INSTALL_DIR="$HOME/.dotnet"
          DOTNET_IMAGE="mcr.microsoft.com/dotnet/sdk:9.0.317-noble"
          rm -rf "$DOTNET_INSTALL_DIR"
          sdk_container="$(docker create "$DOTNET_IMAGE")"
          trap 'docker rm -f "$sdk_container" >/dev/null 2>&1 || true' EXIT
          docker cp "$sdk_container":/usr/share/dotnet "$DOTNET_INSTALL_DIR"
          "$DOTNET_INSTALL_DIR/dotnet" --info >/dev/null
          echo "DOTNET_ROOT=$DOTNET_INSTALL_DIR" >> "$GITHUB_ENV"
          echo "PATH=$DOTNET_INSTALL_DIR:$PATH" >> "$GITHUB_ENV"

      - name: Restore NuGet packages
        run: |
          export PATH="$HOME/.dotnet:$PATH"
          for attempt in 1 2 3; do
            if dotnet restore Jellyfin.Server/Jellyfin.Server.csproj --runtime linux-x64; then
              exit 0
            fi
            if [ "$attempt" -eq 3 ]; then
              exit 1
            fi
            sleep "$((attempt * 10))"
          done

      - name: Publish Jellyfin server
        run: |
          export PATH="$HOME/.dotnet:$PATH"
          # The source is pinned to net9.0 while the runtime image currently
          # carries ASP.NET 10. Match the known-good production artifact by
          # publishing the .NET 9 runtime with the server.
          dotnet publish Jellyfin.Server/Jellyfin.Server.csproj \
            --configuration Release \
            --runtime linux-x64 \
            --self-contained true \
            --no-restore \
            -p:TreatWarningsAsErrors=false \
            --output ./publish-output

      - name: Publish hot-cache worker
        run: |
          export PATH="$HOME/.dotnet:$PATH"
          for attempt in 1 2 3; do
            if dotnet restore Jellyfin.HotCache.Worker/Jellyfin.HotCache.Worker.csproj; then
              break
            fi
            if [ "$attempt" -eq 3 ]; then
              exit 1
            fi
            sleep "$((attempt * 10))"
          done
          dotnet publish Jellyfin.HotCache.Worker/Jellyfin.HotCache.Worker.csproj \
            --configuration Release \
            --no-restore \
            -p:TreatWarningsAsErrors=false \
            --output ./hot-cache-worker-output

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@37fe631027851001ddb9b187196cc803df7f5f0e # v4

      - name: Build and push image
        id: server_image
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7
        with:
          context: .
          file: Dockerfile.runtime
          platforms: linux/amd64
          # Only push the image on direct branch pushes, not on pull_request events.
          push: ${{ github.event_name == 'push' }}
          provenance: false
          build-args: |
            JELLYFIN_BUILD_IDENTITY=${{ github.sha }}
          tags: |
            ${{ steps.meta.outputs.image_repo }}:${{ steps.meta.outputs.short_sha }}
            ${{ steps.meta.outputs.image_repo }}:latest

      - name: Verify published server image identity and record digest
        if: github.event_name == 'push'
        env:
          EXPECTED_BUILD_IDENTITY: ${{ github.sha }}
          SERVER_IMAGE_DIGEST: ${{ steps.server_image.outputs.digest }}
          SERVER_IMAGE_REF: ${{ steps.meta.outputs.image_repo }}:${{ steps.meta.outputs.short_sha }}
        run: |
          test -n "$SERVER_IMAGE_DIGEST"
          docker pull "$SERVER_IMAGE_REF"
          actual_build_identity="$(docker run --rm --entrypoint /bin/sh "$SERVER_IMAGE_REF" -c 'printf %s "$JELLYFIN_BUILD_IDENTITY"')"
          test "$actual_build_identity" = "$EXPECTED_BUILD_IDENTITY"
          printf 'Server image: `%s@%s`\n' "${SERVER_IMAGE_REF%:*}" "$SERVER_IMAGE_DIGEST" >> "$GITHUB_STEP_SUMMARY"

      - name: Build and push hot-cache worker image
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7
        with:
          context: .
          file: Jellyfin.HotCache.Worker/Dockerfile.runtime
          platforms: linux/amd64
          push: ${{ github.event_name == 'push' }}
          provenance: false
          tags: |
            git.nicholstech.org/nichols-homelab/jellyfin-hot-cache-worker:${{ steps.meta.outputs.short_sha }}
            git.nicholstech.org/nichols-homelab/jellyfin-hot-cache-worker:latest
