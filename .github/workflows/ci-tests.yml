name: Tests
on:
  push:
    branches:
      - master
      - main
  # Run tests against the forked branch, but
  # do not allow access to secrets
  # https://docs.github.com/en/actions/using-workflows/events-that-trigger-workflows#workflows-in-forked-repositories
  pull_request:

env:
  SDK_VERSION: "10.0.x"

jobs:
  catalog-ownership-postgresql:
    runs-on: [self-hosted, k3s, linux, amd64]
    services:
      postgres:
        image: postgres:18-alpine
        ports:
          - 5432
        env:
          POSTGRES_DB: jellyfin_catalog_test
          POSTGRES_USER: jellyfin
          POSTGRES_PASSWORD: jellyfin-test
        options: >-
          --health-cmd "pg_isready -U jellyfin -d jellyfin_catalog_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12
      redis:
        image: redis:7-alpine
        ports:
          - 6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Connect to PostgreSQL and Redis test services
        env:
          POSTGRES_TEST_PORT: ${{ job.services.postgres.ports[5432] }}
          REDIS_TEST_PORT: ${{ job.services.redis.ports[6379] }}
        run: |
          # This runner uses Docker's default bridge, which has no service-name DNS.
          # Reach each job-scoped published port through the sibling DinD gateway.
          gateway_hex="$(awk '$2 == "00000000" { print $3; exit }' /proc/net/route)"
          test "${#gateway_hex}" -eq 8
          printf -v service_gateway '%d.%d.%d.%d' \
            "0x${gateway_hex:6:2}" "0x${gateway_hex:4:2}" \
            "0x${gateway_hex:2:2}" "0x${gateway_hex:0:2}"
          test -n "$POSTGRES_TEST_PORT"
          test -n "$REDIS_TEST_PORT"
          timeout 10 bash -c 'exec 3<>/dev/tcp/"$1"/"$2"' _ "$service_gateway" "$POSTGRES_TEST_PORT"
          timeout 10 bash -c 'exec 3<>/dev/tcp/"$1"/"$2"' _ "$service_gateway" "$REDIS_TEST_PORT"
          postgres_connection="Host=$service_gateway;Port=$POSTGRES_TEST_PORT;Database=jellyfin_catalog_test;Username=jellyfin;Password=jellyfin-test"
          echo "JELLYFIN_CATALOG_TEST_POSTGRES=$postgres_connection" >> "$GITHUB_ENV"
          echo "JELLYFIN_TEST_POSTGRES_CONNECTION_STRING=$postgres_connection" >> "$GITHUB_ENV"
          echo "JELLYFIN_TEST_REDIS=$service_gateway:$REDIS_TEST_PORT" >> "$GITHUB_ENV"

      - name: Install .NET SDK
        run: |
          DOTNET_INSTALL_DIR="$HOME/.dotnet"
          mkdir -p "$DOTNET_INSTALL_DIR"
          curl -fsSL https://dot.net/v1/dotnet-install.sh | bash /dev/stdin --channel 10.0 --install-dir "$DOTNET_INSTALL_DIR"
          echo "DOTNET_ROOT=$DOTNET_INSTALL_DIR" >> "$GITHUB_ENV"
          echo "PATH=$DOTNET_INSTALL_DIR:$PATH" >> "$GITHUB_ENV"

      - name: Test PostgreSQL migrations, provider, concurrency, and catalog ownership
        run: |
          export PATH="$HOME/.dotnet:$PATH"
          dotnet test tests/Jellyfin.Database.Tests.PostgreSQL/Jellyfin.Database.Tests.PostgreSQL.csproj \
            --configuration Release \
            --verbosity minimal

      - name: Publish server for full migration startup tests
        run: |
          export PATH="$HOME/.dotnet:$PATH"
          dotnet publish Jellyfin.Server/Jellyfin.Server.csproj \
            --configuration Release \
            --self-contained false \
            --output ./test-server-output
          echo "JELLYFIN_TEST_SERVER_DLL=$PWD/test-server-output/jellyfin.dll" >> "$GITHUB_ENV"

      - name: Test fresh and upgraded PostgreSQL startup and restart
        run: |
          export PATH="$HOME/.dotnet:$PATH"
          test -f "$JELLYFIN_TEST_SERVER_DLL"
          dotnet test tests/Jellyfin.Server.Tests/Jellyfin.Server.Tests.csproj \
            --configuration Release \
            --verbosity minimal \
            --filter "FullyQualifiedName~PostgreSqlStartupMigrationTests"

      - name: Test cluster-wide catalog propagation
        run: |
          export PATH="$HOME/.dotnet:$PATH"
          dotnet test tests/Jellyfin.Server.Implementations.Tests/Jellyfin.Server.Implementations.Tests.csproj \
            --configuration Release \
            --verbosity minimal \
            --filter "FullyQualifiedName~CatalogReplicaConvergenceTests|FullyQualifiedName~Redis"

  run-tests:
    runs-on: [self-hosted, k3s, linux, amd64]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # Install .NET — use GITHUB_ENV (not GITHUB_PATH) to set PATH because
      # ARC self-hosted runner pods don't pick up GITHUB_PATH between steps.
      - name: Install .NET SDK
        run: |
          DOTNET_INSTALL_DIR="$HOME/.dotnet"
          mkdir -p "$DOTNET_INSTALL_DIR"
          curl -fsSL https://dot.net/v1/dotnet-install.sh | bash /dev/stdin --channel 10.0 --install-dir "$DOTNET_INSTALL_DIR"
          echo "DOTNET_ROOT=$DOTNET_INSTALL_DIR" >> "$GITHUB_ENV"
          echo "PATH=$DOTNET_INSTALL_DIR:$PATH" >> "$GITHUB_ENV"

      - name: Run DotNet CLI Tests
        run: |
          export PATH="$HOME/.dotnet:$PATH"
          dotnet test Jellyfin.sln \
            --configuration Release \
            --collect:"XPlat Code Coverage" \
            --settings tests/coverletArgs.runsettings \
            --verbosity minimal \
            --filter "Category!=RequiresDocker&FullyQualifiedName!~Integration"

      - name: Merge code coverage results
        uses: danielpalme/ReportGenerator-GitHub-Action@d3ebf1f760f7d8ab92cc44d9bcfee7ad73722a31 # v5.5.11
        with:
          reports: "**/coverage.cobertura.xml"
          targetdir: "merged/"
          reporttypes: "Cobertura"

      # TODO - which action / tool to use to publish code coverage results?
      # - name: Publish code coverage results

  # Phase 5 transcode coverage gate — runs in parallel with run-tests.
  # Explicitly targets the three test assemblies most affected by Phase 5 HLS
  # session-sharing and PostgreSQL media-encoding changes so failures surface
  # with a dedicated check status independent of the full test matrix.
  run-phase5-tests:
    runs-on: [self-hosted, k3s, linux, amd64]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install .NET SDK
        run: |
          DOTNET_INSTALL_DIR="$HOME/.dotnet"
          mkdir -p "$DOTNET_INSTALL_DIR"
          curl -fsSL https://dot.net/v1/dotnet-install.sh | bash /dev/stdin --channel 10.0 --install-dir "$DOTNET_INSTALL_DIR"
          echo "DOTNET_ROOT=$DOTNET_INSTALL_DIR" >> "$GITHUB_ENV"
          echo "PATH=$DOTNET_INSTALL_DIR:$PATH" >> "$GITHUB_ENV"

      - name: Run Phase 5 Transcode Tests (API)
        run: |
          export PATH="$HOME/.dotnet:$PATH"
          dotnet test tests/Jellyfin.Api.Tests/Jellyfin.Api.Tests.csproj \
            --configuration Release \
            --collect:"XPlat Code Coverage" \
            --settings tests/coverletArgs.runsettings \
            --verbosity minimal \
            --filter "Category!=RequiresDocker"

      - name: Run Phase 5 Transcode Tests (HLS)
        run: |
          export PATH="$HOME/.dotnet:$PATH"
          dotnet test tests/Jellyfin.MediaEncoding.Hls.Tests/Jellyfin.MediaEncoding.Hls.Tests.csproj \
            --configuration Release \
            --collect:"XPlat Code Coverage" \
            --settings tests/coverletArgs.runsettings \
            --verbosity minimal \
            --filter "Category!=RequiresDocker"

      - name: Run Phase 5 Transcode Tests (Server.Implementations)
        run: |
          export PATH="$HOME/.dotnet:$PATH"
          dotnet test tests/Jellyfin.Server.Implementations.Tests/Jellyfin.Server.Implementations.Tests.csproj \
            --configuration Release \
            --collect:"XPlat Code Coverage" \
            --settings tests/coverletArgs.runsettings \
            --verbosity minimal \
            --filter "Category!=RequiresDocker"

      - name: Merge Phase 5 code coverage results
        uses: danielpalme/ReportGenerator-GitHub-Action@d3ebf1f760f7d8ab92cc44d9bcfee7ad73722a31 # v5.5.11
        with:
          reports: "**/coverage.cobertura.xml"
          targetdir: "merged-phase5/"
          reporttypes: "Cobertura"
